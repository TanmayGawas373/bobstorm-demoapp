version: '3.9'

services:
  backend:
    build: ./backend
    container_name: shopsmart-backend
    volumes:
      - db-data:/data
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development

  frontend:
    build: ./frontend
    container_name: shopsmart-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
